<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#244b3b" />
    <link id="app-favicon" rel="icon" type="image/png" href="/icons/wallet-favicon-light.png" sizes="48x48" />
    <script>
      (function () {
        var preference = "system";
        try {
          var saved = localStorage.getItem("cash-tracker-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch (_) {}
        var dark = preference === "dark";
        if (preference === "system") {
          try {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (_) {}
        }
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", dark ? "#101a17" : "#244b3b");
        document
          .querySelector('link#app-favicon')
          .setAttribute("href", dark ? "/icons/wallet-favicon-dark.png" : "/icons/wallet-favicon-light.png");
      })();
    </script>
    <meta
      name="description"
      content="Seu histórico salarial, orçamento e reserva em um lugar. Local, simples e offline."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="apple-touch-icon" href="/icons/wallet-apple-touch.png" sizes="180x180" />
    <title>Cash Tracker · Seu dinheiro, com clareza</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
